name: Worker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 只读 checkout；生产 worker 仍保持 permissions: {}
permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1
        with:
          ignore: none

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -e
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n1 shellcheck --severity=warning

  yaml-syntax:
    name: YAML syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Validate YAML
        run: |
          set -e
          python3 -c "
          import sys, yaml, glob
          rc = 0
          for path in sorted(glob.glob('.github/workflows/*.y*ml', recursive=True)):
              with open(path) as f:
                  try:
                      yaml.safe_load(f)
                      print(f'OK: {path}')
                  except yaml.YAMLError as e:
                      print(f'FAIL: {path}: {e}', file=sys.stderr)
                      rc = 1
          sys.exit(rc)
          "

  payload-validation:
    name: Payload validation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run payload validation tests
        run: bash tests/test-payload-validation.sh

      - name: Run validator sync test
        run: bash tests/test-validator-sync.sh

  workflow-contract:
    name: Workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify execute job has dynamic environment binding
        run: |
          set -e
          WORKFLOW=".github/workflows/task-handler.yml"
          
          # Check that execute job has environment binding with dynamic project name
          if ! grep -A 5 'jobs:' "$WORKFLOW" | grep -A 5 'execute:' | grep -q 'environment:'; then
            echo "::error::execute job 缺少 environment 绑定" >&2
            exit 1
          fi
          
          # Check that environment.name uses client_payload.project
          if ! grep -A 10 'jobs:' "$WORKFLOW" | grep -A 10 'execute:' | grep -q 'name: \${{ github.event.client_payload.project }}'; then
            echo "::error::environment.name 未使用动态项目名 \${{ github.event.client_payload.project }}" >&2
            exit 1
          fi
          
          # Check that PROJECT_SECRETS_BUNDLE uses PROJECT_SECRETS_JSON secret
          if ! grep -q 'PROJECT_SECRETS_BUNDLE: \${{ secrets.PROJECT_SECRETS_JSON }}' "$WORKFLOW"; then
            echo "::error::PROJECT_SECRETS_BUNDLE 未绑定 PROJECT_SECRETS_JSON Secret" >&2
            exit 1
          fi
          
          echo "OK: workflow contract 验证通过"
