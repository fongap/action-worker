name: Worker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install actionlint
        id: actionlint
        shell: bash
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: |
          "${{ steps.actionlint.outputs.executable }}" -color

      - name: Run shellcheck
        run: |
          set -e
          find scripts tests -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 shellcheck --severity=warning

  payload:
    name: Payload validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run payload tests
        run: bash tests/test-payload-validation.sh

      - name: Run declaration resolution tests
        run: bash tests/test-declaration-resolution.sh