name: Task Handler

on:
  repository_dispatch:
    types: [run-task]

permissions: {}

concurrency:
  group: action-worker-${{ github.event.client_payload.project }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    environment:
      name: ${{ github.event.client_payload.project }}

    steps:
      - name: Validate payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          if [ -n "${PAYLOAD:-}" ]; then
              echo "::add-mask::${PAYLOAD}"
          fi

          SUPPORTED_SCHEMA_VERSIONS=("1")

          if ! printf '%s' "$PAYLOAD" | jq -e . >/dev/null 2>&1; then
              echo "::error::任务未启动：请求数据不是合法 JSON，请检查调用参数。" >&2
              exit 64
          fi

          schema_version=$(printf '%s' "$PAYLOAD" | jq -r '.schema_version // empty')
          request_id=$(printf '%s' "$PAYLOAD"     | jq -r '.request_id     // empty')
          project=$(printf '%s' "$PAYLOAD"        | jq -r '.project        // empty')
          bootstrap_ref=$(printf '%s' "$PAYLOAD"  | jq -r '.bootstrap_ref  // empty')

          if [ -z "$schema_version" ] || [ -z "$request_id" ] || [ -z "$project" ] || [ -z "$bootstrap_ref" ]; then
              echo "::error::任务未启动：请求缺少必要字段，请确认 schema_version、request_id、project、bootstrap_ref 均已传入。" >&2
              exit 64
          fi

          supported=0
          for v in "${SUPPORTED_SCHEMA_VERSIONS[@]}"; do
              if [ "$v" = "$schema_version" ]; then
                  supported=1
                  break
              fi
          done

          if [ "$supported" -ne 1 ]; then
              echo "::error::任务未启动：schema_version=${schema_version} 暂不支持，当前仅支持版本 1。" >&2
              exit 65
          fi

          if ! [[ "$request_id" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
              echo "::error::任务未启动：request_id 格式不正确，只允许字母、数字、点、横线和下划线。" >&2
              exit 64
          fi

          if ! [[ "$project" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::任务未启动：项目名称 '${project}' 格式不正确。" >&2
              exit 64
          fi

          if ! [[ "$bootstrap_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::任务未启动：bootstrap_ref 必须使用完整的 40 位 Commit SHA。" >&2
              exit 64
          fi

          unknown=$(printf '%s' "$PAYLOAD" | jq -r '
              ["schema_version","request_id","project","bootstrap_ref"] as $allowed |
              [ keys[] | select(. as $k | $allowed | index($k) | not) ]
              | join(",")
          ')

          if [ -n "$unknown" ]; then
              echo "::error::任务未启动：发现不支持的请求字段：${unknown}。请删除后重试。" >&2
              exit 64
          fi

      - name: Execute task
        env:
          GH_EXECUTION_REPO: ${{ vars.GH_EXECUTION_REPO }}
          GH_EXECUTION_REPO_PAT: ${{ secrets.GH_EXECUTION_REPO_PAT }}
          WORKER_SECRETS_JSON: ${{ toJSON(secrets) }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          PROJECT_SECRETS_BUNDLE="$(
              printf '%s' "${WORKER_SECRETS_JSON}" |
              jq -c '
                  del(
                      .GH_EXECUTION_REPO_PAT,
                      .GITHUB_TOKEN
                  )
              '
          )"

          export PROJECT_SECRETS_BUNDLE
          unset WORKER_SECRETS_JSON

          if ! printf '%s' "$PROJECT_SECRETS_BUNDLE" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::任务未启动：项目 Secrets 读取失败，请检查对应 GitHub Environment 的 Secrets 配置。" >&2
              exit 1
          fi

          schema_version=$(printf '%s' "$PAYLOAD" | jq -r '.schema_version // empty')
          request_id=$(printf '%s' "$PAYLOAD"     | jq -r '.request_id     // empty')
          project=$(printf '%s' "$PAYLOAD"        | jq -r '.project        // empty')
          bootstrap_ref=$(printf '%s' "$PAYLOAD"  | jq -r '.bootstrap_ref  // empty')

          if [ -n "${GH_EXECUTION_REPO_PAT:-}" ]; then
              echo "::add-mask::${GH_EXECUTION_REPO_PAT}"
          fi

          if [ -n "${PROJECT_SECRETS_BUNDLE:-}" ]; then
              echo "::add-mask::${PROJECT_SECRETS_BUNDLE}"
          fi

          if [ -z "${GH_EXECUTION_REPO:-}" ]; then
              echo "::error::任务未启动：缺少 GH_EXECUTION_REPO，请在当前项目 Environment 的 Variables 中配置。" >&2
              exit 1
          fi

          if [ -z "${GH_EXECUTION_REPO_PAT:-}" ]; then
              echo "::error::任务未启动：缺少 GH_EXECUTION_REPO_PAT，请在当前项目 Environment 的 Secrets 中配置。" >&2
              exit 1
          fi

          echo "::group::Task Info"
          echo "Run ID        : ${GITHUB_RUN_ID}"
          echo "Request ID    : ${request_id}"
          echo "Schema        : ${schema_version}"
          echo "Project       : ${project}"
          echo "Bootstrap Ref : ${bootstrap_ref}"
          echo "Runner OS     : ${RUNNER_OS}"
          echo "Start Time    : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"

          TMP_SCRIPT="$(mktemp -t bootstrap.XXXXXX.sh)"

          cleanup() {
              unset GH_EXECUTION_REPO_PAT 2>/dev/null || true
              unset PROJECT_SECRETS_BUNDLE 2>/dev/null || true
              unset WORKER_SECRETS_JSON 2>/dev/null || true
              rm -f "$TMP_SCRIPT"
          }

          trap cleanup EXIT

          BOOTSTRAP_URL="https://raw.githubusercontent.com/${GH_EXECUTION_REPO}/${bootstrap_ref}/bootstrap.sh"

          download_bootstrap() {
              local attempt=1
              local max_attempts=3
              local http_code=000
              local curl_rc=0

              while [ "$attempt" -le "$max_attempts" ]; do
                  : > "$TMP_SCRIPT"

                  if http_code=$(curl -sSL \
                      --connect-timeout 15 \
                      --max-time 60 \
                      --retry 0 \
                      -H "Authorization: Bearer ${GH_EXECUTION_REPO_PAT}" \
                      -o "$TMP_SCRIPT" \
                      -w "%{http_code}" \
                      "$BOOTSTRAP_URL"); then
                      curl_rc=0
                  else
                      curl_rc=$?
                  fi

                  case "$http_code" in
                      2*) return 0 ;;
                      4*) break ;;
                  esac

                  attempt=$((attempt + 1))

                  if [ "$attempt" -le "$max_attempts" ]; then
                      echo "::warning::启动脚本下载失败（HTTP ${http_code}），正在重试 $((attempt-1))/${max_attempts}..." >&2
                      sleep $((attempt * 2))
                  fi
              done

              echo "::error::任务未启动：无法下载 bootstrap.sh（HTTP ${http_code}）。请检查执行仓库、Commit SHA 以及 PAT 的仓库读取权限。" >&2
              return 1
          }

          echo "Downloading bootstrap script ..."

          if ! download_bootstrap; then
              exit 1
          fi

          chmod 700 "$TMP_SCRIPT"

          echo "Executing bootstrap.sh ..."

          bootstrap_rc=0
          set +e
          bash "$TMP_SCRIPT" "$project" "$bootstrap_ref" "$request_id"
          bootstrap_rc=$?
          set -e

          unset GH_EXECUTION_REPO_PAT
          unset PROJECT_SECRETS_BUNDLE
          unset WORKER_SECRETS_JSON 2>/dev/null || true

          if [ -n "${GH_EXECUTION_REPO_PAT:-}" ]; then
              echo "::error::任务异常终止：安全凭据清理失败，请检查 worker 执行流程。" >&2
              exit 1
          fi

          if env | grep -q '^GH_EXECUTION_REPO_PAT='; then
              echo "::error::任务异常终止：运行环境仍存在敏感凭据，请检查 worker 执行流程。" >&2
              exit 1
          fi

          if [ "$bootstrap_rc" -ne 0 ]; then
              echo "::group::Task Result"
              echo "Request ID    : ${request_id}"
              echo "Project       : ${project}"
              echo "Bootstrap Ref : ${bootstrap_ref}"
              echo "Result        : FAILURE"
              echo "Exit Code     : ${bootstrap_rc}"
              echo "End Time      : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "::endgroup::"
              echo "::error::任务执行失败（退出码 ${bootstrap_rc}）。请查看上方最后一条错误信息定位具体原因。" >&2
              exit "$bootstrap_rc"
          fi

          echo "::group::Task Result"
          echo "Request ID    : ${request_id}"
          echo "Project       : ${project}"
          echo "Bootstrap Ref : ${bootstrap_ref}"
          echo "Result        : SUCCESS"
          echo "Exit Code     : 0"
          echo "End Time      : $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "::endgroup::"